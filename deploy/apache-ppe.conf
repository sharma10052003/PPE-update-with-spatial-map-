# Apache site for the PPE map, e.g. https://ppe.sherubtse.edu.bt
#
# 1. Point a DNS name (e.g. ppe.sherubtse.edu.bt) at this server.
# 2. Copy this file:   sudo cp apache-ppe.conf /etc/apache2/sites-available/ppe.conf
#    and change ServerName below.
# 3. Enable:           sudo a2enmod proxy proxy_http headers
#                      sudo a2ensite ppe && sudo systemctl reload apache2
# 4. HTTPS (required, so the admin password isn't sent in clear text):
#                      sudo apt-get install -y certbot python3-certbot-apache
#                      sudo certbot --apache -d ppe.sherubtse.edu.bt
#    certbot adds the :443 site and the http->https redirect automatically.

<VirtualHost *:80>
    ServerName ppe.sherubtse.edu.bt

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    RequestHeader set X-Forwarded-Proto "http"

    # Allow Excel uploads up to 20 MB
    LimitRequestBody 20971520

    ErrorLog  ${APACHE_LOG_DIR}/ppe-error.log
    CustomLog ${APACHE_LOG_DIR}/ppe-access.log combined
</VirtualHost>
