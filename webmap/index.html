    <title>Sherubtse College Webmap</title>

    <style>
      html, body, #map {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
      }
      html, body {
        background-color: #ffffff;
        overflow: hidden;
      }
      .ol-control > * {
        background-color: #f8f8f8 !important;
        color: #444444 !important;
        border-radius: 0px;
      }
      .ol-attribution a,
      .gcd-gl-input::placeholder,
      .search-layer-input-search::placeholder {
        color: #444444 !important;
      }
      .search-layer-input-search {
        background-color: #f8f8f8 !important;
      }
      .ol-control > *:focus,
      .ol-control > *:hover {
        background-color: rgba(248, 248, 248, 0.7) !important;
      }
      .ol-control {
        background-color: rgba(255, 255, 255, 0.4) !important;
        padding: 2px !important;
      }

      :root{
        --ui-left: 8px;
        --ui-top: 74px;              /* below default OL zoom control */
        --toggle-h: 26px;
        --toggle-w: 86px;
        --ui-gap: 8px;
        --credit-pad-v: 6px;
        --credit-pad-h: 10px;
        --credit-font: 13px;
        --credit-line: 1.35;
      }

      /* Legend toggle button */
      #legend-toggle {
        position: fixed;
        top: calc(var(--ui-top) + env(safe-area-inset-top));
        left: calc(var(--ui-left) + env(safe-area-inset-left));
        background: #ffffff;
        border-radius: 2px;
        box-shadow: 0 1px 5px rgba(0,0,0,0.4);
        overflow: hidden;
        padding: 0;
        z-index: 1000;
      }
      #legend-toggle button {
        width: var(--toggle-w);
        height: var(--toggle-h);
        background: #f8f8f8;
        border: none;
        border-top: 1px solid #ccc;
        color: #444;
        font-size: 13px;
        cursor: pointer;
        padding: 3px 6px;
        text-align: left;
        white-space: nowrap;
      }
      #legend-toggle button:first-child { border-top: none; }
      #legend-toggle button:hover { background: rgba(248,248,248,0.7); }

      /* Credit bar */
      #map-credit {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.55);
        color: #ffffff;
        padding: 6px 12px;
        font-size: 13px;
        font-family: "Segoe UI", Arial, sans-serif;
        border-radius: 6px;
        letter-spacing: 0.5px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        z-index: 9999;
        backdrop-filter: blur(3px);
        }

      /* Legend container */
      #map-legend {
        position: fixed;
        left: calc(var(--ui-left) + env(safe-area-inset-left));
        top: calc(var(--ui-top) + var(--toggle-h) + var(--ui-gap) + env(safe-area-inset-top));
        height: auto;
        max-height: calc(
          100vh
          - (var(--ui-top) + var(--toggle-h) + var(--ui-gap) + 16px + env(safe-area-inset-top))
          - (8px + env(safe-area-inset-bottom) + (var(--credit-font) * 2.6) + (var(--credit-pad-v) * 2) + 16px)
        );
        display: inline-block;
        width: auto !important;
        min-width: 180px !important;
        max-width: 320px !important;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.55);
        color: #ffffff;
        padding: 12px;
        font-size: 13px;
        font-family: Arial, sans-serif;
        line-height: 1.5;
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        z-index: 999;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      #map-legend.collapsed { display: none; }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
        cursor: pointer;
        user-select: none;
        white-space: normal;
      }

      .legend-item input { cursor: pointer; }

      .legend-color {
        width: 14px;
        height: 14px;
        display: inline-block;
        flex: 0 0 auto;
      }

      /* Small screens: keep legend narrower */
      @media (max-width: 900px) {
        #map-legend {
          max-width: min(240px, 75vw) !important;
          padding: 10px;
          font-size: 12px;
        }
      }

      /* Phones */
      @media (max-width: 480px) {
        :root{
          --ui-top: 64px;
          --toggle-w: 78px;
          --credit-font: 12px;
        }
        #legend-toggle button { font-size: 12px; }
        #map-legend {
          max-width: min(220px, 80vw) !important;
          padding: 10px;
          font-size: 12px;
        }
      }
    </style>

      function toggleLayer(layer, isChecked) {
        if (layer) layer.setVisible(isChecked);
      }

      document.getElementById("legend-btn").addEventListener("click", function () {
        document.getElementById("map-legend").classList.toggle("collapsed");
      });

      window.addEventListener("load", function () {
        if (typeof map !== "undefined" && map && map.on) {
          map.on("click", function () {
            document.getElementById("map-legend").classList.add("collapsed");
          });
        }
